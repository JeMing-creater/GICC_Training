train:
  seed: 42

  # =========================
  # stage schedule
  # =========================
  epochs: 120
  stage1_epochs: 20
  stage2_epochs: 70
  stage3_epochs: 30

  # =========================
  # optimization
  # =========================
  weight_decay: 0.0001
  grad_accum_steps: 1
  grad_clip: 1.0

  optimizer:
    lr_detector: 0.0001
    lr_backbone: 0.0001
    lr_cls: 0.0001

    # stage2 中 detector / backbone 的学习率倍率
    stage2_detector_mult: 1.0
    stage2_backbone_mult: 1.0

  scheduler:
    name: "cosine"
    min_lr: 0.000001

  # =========================
  # task thresholds
  # =========================
  segmentation:
    threshold: 0.5

  classification:
    threshold: 0.5
    pos_weight: 1.0

  # =========================
  # loss weights
  # =========================
  loss:
    # stage1
    detector_weight_stage1: 1.0

    # detector internal weights
    detector_modal_consistency_weight: 0.10
    detector_coord_weight: 0.25
    detector_sharpness_weight: 0.05
    detector_center_blob_weight: 0.10

    # stage2
    detector_weight_stage2: 0.5
    seg_weight_stage2: 1.0
    coverage_penalty_weight_stage2: 0.5

    # stage3
    cls_weight_stage3: 1.0

  # =========================
  # stage2 coverage-aware training
  # =========================
  coverage:
    threshold: 0.90
    hard_reject_below: 0.50
    soft_weighting: true

  step_timeout_sec: 120


monitor:
  # stage1 best model
  stage1: "roi_coverage"
  stage1_weights:
    coverage: 1.0
    seed_in: 0.5
    center_l1: 0.1

  # stage2 best model
  stage2: "hybrid"
  stage2_weights:
    seg_dice: 0.8
    coverage: 0.2

  # stage3 best model
  stage3: "cls_f1"


checkpoint:
  resume: true
  latest_dirname: "latest"

  # 建议保存多个 best
  best_stage1_filename: "best_stage1_detector.pth"
  best_stage2_filename: "best_stage2_seg.pth"
  best_stage3_filename: "best_stage3_cls.pth"
  best_filename: "best.pth"

  # optional initialization weight
  init_weights_path: ""


accelerate:
  # "no" | "fp16" | "bf16"
  mixed_precision: "bf16"


logging:
  project_name: "colon_mri_seed_guided"
  log_root: "log"
  run_name: "seed_guided_multitask_v3"
  timezone: "Asia/Seoul"
  log_interval: 20

  visualization:
    enable: true
    every_n_epochs: 1
    max_samples_per_split: 5
    save_train: true
    save_val: true
    save_test: true
    keep_last_n_epochs: 5


model:
  # input / output channels
  in_channel: 2
  out_ch: 2

  # detector
  detector_base_ch: 32
  detector_feat_dim: 96
  detector_stride_xy: 4
  detector_mamba_d_state: 16
  detector_mamba_d_conv: 4
  detector_mamba_expand: 2
  detector_mamba_nslices: 8
  detector_softargmax_beta: 10.0

  # roi / seed prior
  roi_size_fullres: [64, 64, 32]
  seed_region_radius_fullres: [16, 16, 8]
  seed_prior_sigma_scale: 0.20

  # backbone
  backbone_base_ch: 32


data:
  root_dir: "/mnt/liangjm/GICC/"
  loader_timeout: 120

  # =========================
  # split from T.xlsx
  # =========================
  t_dataset:
    excel_filename: "T.xlsx"
    id_col: 0
    label_col: 2
    train_tag_col: 3
    train_tag_value: "train"
    val_split_ratio: 0.1

  # modalities define input channels
  use_modalities: ["T2_FS","V"]

  # unified full-resolution network input
  target_size: [128, 128, 64]

  # dataloader
  batch_size: 2
  num_workers: 0
  pin_memory: true

  # if seg label is multi-channel but out_ch=1, take first channel
  label_take_first_channel: true

  # skip / blacklist
  leapfrog:
    [
      "101770",
      "91595",
      "126104",
      "66238",
      "90626",
      "91458",
      "114821",
      "103174",
      "65716",
      "101770"
    ]