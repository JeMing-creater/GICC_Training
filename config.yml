train:
  choose_model: "Ours"  # [Ours, SwinUNETR]
  seed: 42
  epochs: 100
  lr: 0.001
  min_lr: 0.0000001
  weight_decay: 1e-4
  scheduler: "cosine"

  # accelerate
  grad_accum_steps: 1
  grad_clip: 1.0

  # multi-task training schedule
  multitask:
    enable: true
    stage_a_epochs: 20
    freeze_cls_in_stage_a: true

  # loss weights
  recon_weight: 0.02
  cls_weight: 0.1
  inv_weight: 0.0

  # classification setup
  classification:
    loss: "bce"
    pos_weight: 1.0
    threshold: 0.5

  # segmentation post-processing threshold for metric computation
  segmentation:
    threshold: 0.5

  # best-checkpoint selection
  model_selection:
    stage_a_monitor: "dice"   # "dice" | "f1" | "hybrid"
    monitor: "hybrid"         # "dice" | "f1" | "hybrid"
    hybrid_weights:
      dice: 0.7
      f1: 0.3

  step_timeout_sec: 120

eval:
  mode: "export"      # "metrics" 或 "export"
  train: false
  weights_path: "/workspace/GICC_training/log/old/checkpoints/best.pth"     # 必填：训练得到的 best 权重路径
  threshold: 0.5       # 推理阈值
  case_id: "105259"          # export 模式必填：病例 id（或 excel_id）
  out_dir: "exports"   # export 输出目录（会自动创建）
  
  per_sample_dice:
    out_dir: "analysis/per_sample_dice"
    xlsx_name: "val_per_sample_dice.xlsx"
    csv_name: "val_per_sample_dice.csv"
    json_name: "val_per_sample_dice.json"
    summary_name: "val_per_sample_dice_summary.txt"

    low_dice: 0.3
    low_dice_xlsx_name: "val_per_sample_low_dice.xlsx"
    low_dice_csv_name: "val_per_sample_low_dice.csv"
    low_dice_json_name: "val_per_sample_low_dice.json"

    worst_k: 20
  
  

checkpoint:
  resume: true
  latest_dirname: "latest"
  best_filename: "best.pth"

  # 可选：如果你想从某个权重初始化（比如预训练或别的run的best）
  # 留空则不加载
  init_weights_path: ""


other:
  run_prefix: "other"      # main_other.py 的 run_name 前缀，避免跟 main.py 混
  model_name: "swinunetr"       # 选择对比模型: "dg" | "unet" | "dynunet"
  ckpt_suffix: "swinunetr"      # checkpoint 文件/目录后缀，避免与 main.py 冲突（可选，默认跟 model_name 一致）

  # （可选）UNet baseline 的一些超参
  unet:
    base_ch: 32
    num_res_units: 2
    norm: "INSTANCE"

  # （可选）DynUNet baseline 的一些超参
  dynunet:
    filters: 32
    dropout: 0.0
    norm: "instance"
    deep_supervision: false
    deep_supr_num: 1
    strides: [1, 2, 2, 2, 2]
    kernels: [3, 3, 3, 3, 3]
  
  # （可选）SwinUNETR baseline 的一些超参
  swinunetr:
    feature_size: 96

accelerate:
  # "no" | "fp16" | "bf16"
  mixed_precision: "bf16"

logging:
  project_name: "colon_mri_dg_seg"
  # log 根目录（与 main.py 同级）
  log_root: "log"
  # 留空则自动用时间戳
  run_name: "Ours4"   # TODO: 写具体模型名称, 不写会产生时间轴，导致覆盖resume
  timezone: "Asia/Seoul"
  log_interval: 20

model:
  # 二分类分割输出 1 通道
  out_ch: 1

  # 结构-风格因子化 DG 分割模型超参（与你已收到的 model/entry.py 对齐）
  base_ch: 32
  depth: 4
  style_dim: 128
  norm: "instance"
  dropout: 0.0

data:
  # 服务器上的根目录
  root_dir: "/mnt/liangjm/GICC/"
  loader_timeout: 120

  # GICC T.xlsx 数据集配置
  # 用于 GICC 结肠癌 MRI 数据的标签读取和数据集划分
  t_dataset:
    excel_filename: "T.xlsx"           # 标签文件
    id_col: 0                           # ID 列索引 (A列)
    label_col: 2                        # 二分类标签列索引 (C列: T-sage)
    train_tag_col: 3                    # train标记列索引 (D列)
    train_tag_value: "train"            # 标记为训练集的值
    val_split_ratio: 0.1                # 从train中划分验证集的比例

  # Excel配置 (保留用于其他数据集扩展)
  excel_configs:
    mei:
      filename: "Mei.xlsx"
      id_col_index: 0
    gz:
      filename: "GZ.xlsx"
      id_col_index: 3
    dg:
      filename: "DG.xlsx"
      id_col_index: 1

  # 模态选择（决定输入通道数）
  use_modalities: ["T2_FS", "V"]

  # 统一尺寸（与你 loader 一致）
  target_size: [128, 128, 64]

  # 黑名单/跳过列表
  leapfrog: ["101770","91595","126104","66238", "90626", "91458","114821","103174","65716","101770"]

  # DataLoader
  batch_size: 4
  num_workers: 0
  pin_memory: true

  # 你的 label 可能是 [B,C,...]（按模态 concat），out_ch=1 时默认取第一个通道
  label_take_first_channel: true


